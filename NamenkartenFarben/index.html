<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Namenskarten Farbcodierung</title>
  <style>
    :root {
      --bg: #f5f2ec;
      --ink: #171a1f;
      --paper: #fffefd;
      --line: #171a1f;
      --inner-line: rgba(70, 58, 48, 0.24);
      --shadow: 0 8px 0 rgba(23, 26, 31, 0.14);
      --gap: clamp(10px, 1.35vw, 18px);
      --card-radius: 13px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image: radial-gradient(circle, rgba(45, 38, 32, 0.13) 1.6px, transparent 1.8px);
      background-size: 72px 72px;
    }

    .app {
      width: min(1840px, calc(100% - clamp(22px, 7vw, 140px)));
      margin: 0 auto;
      padding: clamp(20px, 2.7vw, 34px) 0 clamp(28px, 4vw, 56px);
    }

    h1 {
      margin: 0 0 clamp(30px, 3.5vw, 54px);
      text-align: center;
      font-size: clamp(2rem, 3vw, 3.35rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(132px, 1fr));
      gap: var(--gap);
      align-items: stretch;
    }

    .card-button {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      font: inherit;
      cursor: pointer;
      perspective: 900px;
      min-width: 0;
    }

    .card-button:focus-visible {
      outline: 5px solid rgba(23, 26, 31, 0.26);
      outline-offset: 5px;
      border-radius: var(--card-radius);
    }

    .card {
      display: block;
      position: relative;
      min-height: clamp(118px, 11.3vw, 212px);
      transform-style: preserve-3d;
      transition: transform 360ms ease;
    }

    .card-button.is-revealed .card { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      border: 3px solid var(--line);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      overflow: hidden;
    }

    .face::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px solid var(--inner-line);
      border-radius: calc(var(--card-radius) - 4px);
      pointer-events: none;
    }

    .front {
      background: linear-gradient(180deg, #fff, var(--paper));
    }

    .back {
      color: #fff;
      transform: rotateY(180deg);
      border-color: var(--team);
      border-color: color-mix(in srgb, var(--team) 68%, #171a1f);
      background: var(--team);
    }

    .back::after,
    .back::before {
      opacity: 0.72;
    }

    .back .corner-dot {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 21px;
      height: 21px;
      border: 3px solid rgba(255, 255, 255, 0.78);
      border-radius: 999px;
    }

    .back .corner-diamond {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 22px;
      height: 22px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      transform: rotate(45deg);
    }

    .name {
      position: relative;
      z-index: 1;
      font-size: clamp(1.75rem, 3vw, 3.1rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }

    .back .name { color: var(--text-on-team); }

    .spacer {
      visibility: hidden;
      pointer-events: none;
    }

    @media (max-width: 980px) {
      .board { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
      .spacer { display: none; }
    }

    @media (max-width: 560px) {
      .app { width: min(100% - 18px, 520px); }
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { min-height: 106px; }
      .name { font-size: clamp(1.45rem, 8vw, 2.2rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Namenskarten Farbcodierung</h1>
    <div id="board" class="board" aria-label="Namenskarten Farbcodierung"></div>
  </main>

  <script>
    const cards = [
      { name: "Lukas", team: "orange" },
      { name: "Emily", team: "tuerkis" },
      { name: "Elaine", team: "pink" },
      { name: "Melanie", team: "limette" },
      { name: "Lilly", team: "blau" },
      { name: "Vanessa", team: "orange" },
      { name: "Neele", team: "tuerkis" },
      { name: "Nancy", team: "limette" },
      { name: "Luisa", team: "grau" },
      { name: "Leonie", team: "lila" },
      { name: "Hannah M.", team: "gelb" },
      { name: "Charlene", team: "pink" },
      { name: "Hannah N.", team: "limette" },
      { name: "Robin", team: "orange" },
      { name: "Elias", team: "blau" },
      { name: "Dana", team: "tuerkis" },
      { name: "Cinja", team: "gelb" },
      { name: "Fabian", team: "grau" },
      { name: "Sophie", team: "blau" },
      { name: "Thor", team: "gelb" },
      { name: "Lena", team: "lila" },
      { name: "Lina S.", team: "pink" },
      { name: "Amy", team: "orange" },
      { name: "Lina W.", team: "limette" },
      { spacer: true },
      { spacer: true },
      { name: "Emma", team: "schwarz" },
      { name: "Becky", team: "braun" },
    ];

    const teamStyles = {
      orange: { color: "#ff8517", text: "#171a1f" },
      tuerkis: { color: "#30c9c9", text: "#171a1f" },
      pink: { color: "#f05a9a", text: "#171a1f" },
      limette: { color: "#97d316", text: "#171a1f" },
      blau: { color: "#2f7ed8", text: "#171a1f" },
      gelb: { color: "#ffd31a", text: "#171a1f" },
      lila: { color: "#a554d4", text: "#171a1f" },
      grau: { color: "#b9b9b9", text: "#171a1f" },
      braun: { color: "#a65e20", text: "#171a1f" },
      schwarz: { color: "#050505", text: "#fff" },
    };

    const board = document.getElementById("board");

    board.innerHTML = cards.map((card) => {
      if (card.spacer) return '<div class="spacer" aria-hidden="true"></div>';

      const style = teamStyles[card.team];
      return `
        <button class="card-button" type="button" aria-label="${card.name} aufdecken" aria-pressed="false" style="--team: ${style.color}; --text-on-team: ${style.text};">
          <span class="card">
            <span class="face front"><span class="name">${card.name}</span></span>
            <span class="face back" aria-hidden="true">
              <span class="corner-dot"></span>
              <span class="corner-diamond"></span>
            </span>
          </span>
        </button>
      `;
    }).join("");

    board.addEventListener("click", (event) => {
      const button = event.target.closest(".card-button");
      if (!button) return;

      button.classList.toggle("is-revealed");
      const isRevealed = button.classList.contains("is-revealed");
      button.setAttribute("aria-pressed", String(isRevealed));
      button.setAttribute("aria-label", `${button.textContent.trim()} ${isRevealed ? "wieder verdecken" : "aufdecken"}`);
    });
  </script>
</body>
</html>
